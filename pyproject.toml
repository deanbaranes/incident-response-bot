[tool.ruff]
# Target Python version
target-version = "py311"

# Line length to match black
line-length = 88

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E), Warning (W), isort (I), and pyupgrade (UP)
select = ["E", "F", "W", "I", "UP"]

# Ignore E501 (Line too long) because Black handles formatting, and we don't want strings/comments to fail the build
ignore = ["E501"]
